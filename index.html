<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mensagem 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .texto {
      white-space: nowrap;
      font-size: 1.8em;
      color: white;
      animation: mover 15s linear infinite;
      padding: 0 20px;
      text-align: center;
    }

    @keyframes mover {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="texto">
    Oi minha vida, decidi dar uma inovada e fiz isso, Eu te amo muito tabom?
    Feliz ano novo te desejo tudo de bom, (eu)
  </div>

</body>
</html>
